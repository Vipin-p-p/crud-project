<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student CRUD Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center text-primary mb-4">Student Management System</h2>

    <!-- Student Form -->
    <div class="card shadow p-4 mb-4">
      <h4 class="mb-3">Add Student</h4>
      <form id="studentForm">
        <div class="mb-3">
          <label class="form-label">Student ID</label>
          <input type="text" id="studentID" class="form-control" placeholder="Enter student ID" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Student Name</label>
          <input type="text" id="studentName" class="form-control" placeholder="Enter student name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Student Course</label>
          <input type="text" id="studentCourse" class="form-control" placeholder="Enter course" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Search</label>
          <input type="text" id="searchCourse" class="form-control " placeholder="Search by course">
        </div>

        <input type="hidden" id="editStatus" value="">
        <button type="submit" class="btn btn-primary">Submit</button>

        <button type="reset" class="btn btn-secondary" onclick="editStatus.value=''">Clear</button>
      </form>
    </div>

    <!-- Student Table -->

    <div class="card shadow p-4">
      <h4 class="mb-3">Student Details</h4>
      <div class="table-responsive">
        <table class="table table-bordered table-hover text-center">
          <thead class="table-dark">
            <tr>
              <th>No.</th>
              <th>Student ID</th>
              <th>Student Name</th>
              <th>Course</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="tableBody">

          </tbody>

        </table>
      </div>
    </div>
  </div>
</body>
<script src="./main.js">

</script>

</html>
